[package]
name = "aura"
version = "0.53.49"
edition = "2021"
description = "Aura core business logic and RPC server"
autobins = false

[[bin]]
name = "aura-core"
path = "src/main.rs"

[[bin]]
name = "slack-backfill"
path = "src/bin/slack_backfill.rs"

[[bin]]
name = "gmail-backfill-3d"
path = "src/bin/gmail_backfill_3d.rs"

[lib]
name = "aura_core"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Vendored from https://github.com/silverstein/minutes (MIT) — see
# crates/whisper-guard/LICENSE. Post-processing pass that strips whisper.cpp's
# well-documented hallucination patterns (repetition loops, foreign-script
# drift, known training-data-leak phrases) from transcript segments.
# `default-features = false` avoids pulling its optional `whisper-rs` preset
# feature, which would double up against the whisper-rs version we already
# pin for in-process transcription.
whisper-guard = { path = "crates/whisper-guard", default-features = false }
# (Removed `html2md` dep. dhat-rs profiling on real Gmail inboxes
# showed `html2md::walk` and `html2md::tables::handle` allocating
# ~894 MB peak heap on a 10 KB HTML input from Otter.ai-style emails
# (deeply-nested table-as-layout HTML). Cause: recursive walker holding
# per-frame Vec state across nesting layers + 5 sequential
# `regex::replace_all` passes in `clean_markdown` each producing a
# fresh full-size String. We now use a linear-time tag-and-entity
# stripper (`fast_html_to_text` in
# providers/gmail/post_process.rs) and prefer the email's
# `text/plain` MIME part when available.)
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "native-tls", "stream", "http2", "multipart", "socks"] }
tokio = { version = "1", features = ["full", "sync"] }
once_cell = "1.19"
parking_lot = "0.12"
log = "0.4"
nu-ansi-term = "0.46"
env_logger = "0.11"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.10"
dirs = "5"
sha2 = "0.10"
hmac = "0.12"
# Archive extraction for the Node.js runtime bootstrap. Unix Node
# distributions ship as .tar.xz, Windows as .zip. `xz2` with `static`
# bundles liblzma so we don't need it as a system dependency.
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# gzip decoder for the Piper tar.gz binary releases on macOS / Linux. Already
# pulled in transitively by zip's `deflate` feature; declared directly so
# the installer module can `use flate2::read::GzDecoder`.
flate2 = "1"
# Real timeout for `node --version` probes in the runtime resolver. Guards
# against a broken shim on PATH hanging the bootstrap forever.
wait-timeout = "0.2"
uuid = { version = "1", features = ["v4"] }
anyhow = "1.0"
async-trait = "0.1"
chacha20poly1305 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["rt", "io"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
cron = "0.12"
futures-util = "0.3"
directories = "6"
toml = "1.0"
shellexpand = "3.1"
schemars = "1.2"
tracing = { version = "0.1", default-features = false }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
tracing-appender = "0.2"
prometheus = { version = "0.14", default-features = false }
urlencoding = "2.1"
thiserror = "2.0"
ring = "0.17"
prost = { version = "0.14", default-features = false }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
chrono-tz = "0.10"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dotenvy = "0.15"
console = "0.16"
regex = "1.10"
walkdir = "2"
glob = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"
hostname = "0.4.2"
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1.14.0"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.6"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
mail-parser = "0.11.2"
async-imap = { version = "0.11", features = ["runtime-tokio"], default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
tower = { version = "0.5", default-features = false }
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-client", "reqwest-rustls-webpki-roots"] }
sentry = { version = "0.47.0", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "debug-images", "reqwest", "rustls"] }
tokio-stream = { version = "0.1.18", features = ["full"] }
url = "2"
socketioxide = { version = "0.15", features = ["extensions"] }
whisper-rs = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
cpal = "0.15"
hound = "3.5"
enigo = "0.3"
arboard = "3"
rdev = "0.5"
fs2 = "0.4"
# Cross-platform battery probe for the scheduler gate. Maintained fork of
# the abandoned `battery` crate; same `use battery::*;` API surface. Used
# only by `aura::scheduler_gate::signals` to decide when to throttle
# background LLM work on laptops.
starship-battery = "0.10"
ethers-core = { version = "2.0.14", default-features = false }
ethers-signers = { version = "2.0.14", default-features = false }

# Meeting transcript export (PDF + DOCX). Both are pure-Rust with no native
# C toolchain requirement — deliberately chosen over CDP/webview-based PDF
# generation (see `aura::meetings::export` doc comment) and over any
# crate needing system libraries, given repeated disk/build pain from
# native deps (whisper-rs-sys, onnxruntime) earlier in this project's history.
# `default-features = false` on printpdf drops the `html`/`text_layout*`
# feature set (built on the azul HTML/CSS layout engine) that this domain's
# simple heading+paragraph export doesn't need — we lay out text manually
# with `Op::WriteText` and a fixed line height instead.
printpdf = { version = "0.12", default-features = false }
docx-rs = "0.4"

# Meeting slide OCR (screenshot capture -> text extraction). Pure-Rust OCR
# engine backed by `rten` (the crate author's own pure-Rust tensor runtime,
# NOT Microsoft's onnxruntime) — chosen specifically to avoid the
# ORT_LIB_LOCATION/MSVC-CRT native-dep pain documented above for
# whisper-rs-sys, and because this codebase has no working
# vision-LLM/multimodal path (see `aura::meetings::ocr` doc comment).
ocrs = "0.12"
rten = "0.24"

# Periodic meeting-slide screenshot capture (Block 3: feeds `ocrs` above via
# the existing `ops::meetings_append_screenshot`) for the core-native local
# capture lifecycle (`aura::meetings::capture`). Same crate + version app's
# Tauri shell already depends on for its own (separate, HTTP-RPC-based)
# `meeting_recorder::screenshot` capture loop — see that crate's Cargo.toml
# comment: unlike WASAPI mic/loopback audio (Windows-only for now, see the
# `wasapi` target dependency below), `xcap::Monitor::all()` works on Windows,
# macOS, and Linux, so this is deliberately NOT platform-gated even though
# `aura::meetings::capture::default_backend()` currently only returns a real
# backend on Windows.
xcap = "0.9"

# Real per-speaker diarization for meeting `system_audio` (splitting
# "system_audio" into "system_audio:speaker_N"). Gated behind the optional
# `diarize` Cargo feature (off by default, `dep:`-only below) — this is
# deliberately the ONE place in this codebase that reaches for actual
# onnxruntime (via `ort`), which every other native-dep-avoidance comment on
# this page (ocrs/rten above, whisper-rs-sys's CRT patch below) exists to
# route around. There is no pure-Rust alternative for pyannote's
# segmentation + speaker-embedding ONNX models, so unlike OCR this can't be
# swapped to `rten`. `ort`/`ndarray` versions pinned to match
# `thewh1teagle/pyannote-rs`'s own reference usage exactly (confirmed against
# that crate's published API on docs.rs), since that's the only
# verified-working combination against the model files in
# `meetings::diarize::models`. `pyannote-rs` itself is used only for its
# `EmbeddingExtractor` — its own `get_segments` has a confirmed upstream bug
# (casts i16 samples to f32 without normalizing by 32768, so the
# segmentation model sees values wildly outside its trained [-1.0, 1.0]
# range and reports no speech at all) — `meetings::diarize::engine` reimplements
# segmentation directly against `ort` instead, so `knf-rs` (only needed to
# hand-roll the embedding model's fbank features, which `EmbeddingExtractor`
# already does internally) is deliberately NOT a direct dependency here.
pyannote-rs = { version = "0.3.4", optional = true }
# Pinned exactly (`=`), not a caret range: Cargo's default resolver happily
# picks a newer pre-release like 2.0.0-rc.13 to satisfy a bare
# "2.0.0-rc.10" requirement, and `pyannote-rs` 0.3.4's own `session.rs`
# fails to compile against that newer `ort` (its `?`-based error conversion
# needs `ort::Error<SessionBuilder>: Send + Sync`, which rc.13's `Error<R>`
# no longer satisfies for a generic `R` — a breaking change between rc.10
# and rc.13). The exact pin forces the one version this combination is
# actually known to build against.
ort = { version = "=2.0.0-rc.10", features = ["ndarray"], optional = true }
ndarray = { version = "0.16", optional = true }

matrix-sdk = { version = "0.16", optional = true, default-features = false, features = ["e2e-encryption", "rustls-tls", "markdown"] }
fantoccini = { version = "0.22.0", optional = true, default-features = false, features = ["rustls-tls"] }
serde-big-array = { version = "0.5", optional = true }
pdf-extract = { version = "0.10", optional = true }
# WhatsApp Web — upstream `whatsapp-rust` 0.5. Replaces the previous `wa-rs`
# 0.2 fork: upstream now ships its own SqliteStore (so we no longer need the
# 1.3K-line custom RusqliteStore) and dispatches `Event::Message` for
# LID-addressed contacts and group sender-key (skmsg) messages — both of
# which the 0.2 fork silently dropped after decryption.
whatsapp-rust = { version = "0.5", optional = true, default-features = false, features = ["sqlite-storage", "tokio-runtime"] }
whatsapp-rust-tokio-transport = { version = "0.5", optional = true, default-features = false }
whatsapp-rust-ureq-http-client = { version = "0.5", optional = true }
wacore = { version = "0.5", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
# Contacts framework bindings for address book seeding.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSObject", "NSString", "NSPredicate"] }
objc2-contacts = { version = "0.3.2", features = ["CNContact", "CNContactFetchRequest", "CNContactStore", "CNLabeledValue", "CNPhoneNumber"] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4", optional = true }
rppal = { version = "0.22", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# WASAPI loopback capture for local meeting recording (src/aura/meetings/capture/windows.rs).
# cpal 0.15 has no first-class WASAPI loopback mode (only regular input-device
# capture), so system-audio capture goes through this crate directly:
# `Device::get_iaudioclient()` on a *Render*-direction device, then
# `AudioClient::initialize_client(&fmt, &Direction::Capture, &mode)` — the
# crate sets `AUDCLNT_STREAMFLAGS_LOOPBACK` automatically for that
# Render-device/Capture-direction combination. Microphone capture stays on
# cpal (reuses `voice::audio_capture`'s idioms) — only the loopback track
# needs this Windows-only dependency.
wasapi = "0.24"

[dev-dependencies]
# Enable sentry's TestTransport for runtime smoke of the observability
# before_send filter (see tests/observability_smoke.rs). `default-features
# = false` here is load-bearing — sentry's default feature set pulls in
# actix-web / actix-http / actix-server / sentry-actix and ~13 transitive
# crates we never use (and that bloat the dev Cargo.lock noticeably).
# TestTransport only needs the `test` feature.
sentry = { version = "0.47.0", default-features = false, features = ["test"] }
# Mock HTTP server for provider E2E tests (inference_provider_e2e).
wiremock = "0.6"
# Renders a synthetic test image with known text for
# `aura::meetings::ocr`'s unit tests (`draw_text_mut`). `default-features
# = false` drops imageproc's `rayon` feature, which this single-image test
# usage doesn't need.
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"

[features]
sandbox-landlock = ["dep:landlock"]
sandbox-bubblewrap = []
channel-matrix = ["dep:matrix-sdk"]
peripheral-rpi = ["dep:rppal"]
browser-native = ["dep:fantoccini"]
fantoccini = ["browser-native"]
landlock = ["sandbox-landlock"]
rag-pdf = ["dep:pdf-extract"]
whatsapp-web = ["dep:whatsapp-rust", "dep:whatsapp-rust-tokio-transport", "dep:whatsapp-rust-ureq-http-client", "dep:wacore", "serde-big-array"]
# Exposes the destructive `aura.test_reset` RPC. Off by default; the E2E
# build (app/scripts/e2e-build.sh) flips it on. Shipped binaries never have
# this feature so the wipe RPC isn't even registered, let alone reachable.
e2e-test-support = []

# Real per-speaker diarization for meeting `system_audio` transcript chunks
# (`aura.meetings_diarize`). Off by default — pulls in `ort` (onnxruntime),
# which every other meetings-domain dependency (ocrs/rten for slide OCR,
# printpdf/docx-rs for export) was deliberately chosen to avoid, per the
# native-dep history documented next to `ocrs` above. See
# `src/aura/meetings/diarize/mod.rs` for the module-level honesty note on
# scope (single meeting, no cross-meeting speaker enrollment, no stem/source
# separation — Minutes' `diarize.rs` feature this ports a slice of has all of
# that; this doesn't).
diarize = ["dep:pyannote-rs", "dep:ort", "dep:ndarray"]

# Fix whisper-rs-sys CRT mismatch on Windows MSVC (LNK2038).
# Upstream cmake build defaults to /MD but Rust uses /MT.
# This fork adds config.static_crt(true) to the build script.
# See: https://github.com/tinyhumansai/aura/issues/273
[patch.crates-io]
whisper-rs-sys = { git = "https://github.com/tinyhumansai/whisper-rs-sys.git", branch = "main" }

# Emit just enough DWARF in release builds for Sentry to symbolicate Rust
# panics + render surrounding source lines. `line-tables-only` keeps the
# binary small (only file+line tables, no full type info) while still
# letting `sentry-cli debug-files upload --include-sources` produce a
# usable `.src.zip`. `split-debuginfo = "packed"` writes the debug data
# into a separate `.dSYM` bundle on macOS so the shipped executable
# itself stays slim.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"

# Fast CI builds: trade runtime perf for compile speed
[profile.ci]
inherits = "release"
opt-level = 1
codegen-units = 16
lto = false
incremental = false
strip = true
debug = false
