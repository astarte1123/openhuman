[package]
name = "Aura"
version = "0.53.49"
description = "Aura - AI-powered Super Assistant"
authors = ["Aura"]
edition = "2021"
default-run = "Aura"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aura"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Aura"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# Tauri core and plugins.
#
# The only supported runtime is CEF (Chromium Embedded Framework) via
# `tauri-runtime-cef` — CI builds, release installers, and local `cargo tauri
# dev` all run against CEF. The `[patch.crates-io]` block at the bottom of this
# file pins every tauri crate and plugin to the `feat/cef` branch on github so
# CEF symbols are in scope, and `cef-dll-sys`'s build script auto-downloads the
# Chromium runtime for the current target on first build.
tauri = { version = "2.10", default-features = false, features = [
    "cef",
    "common-controls-v6",
    "devtools",
    "macos-private-api",
    "tray-icon",
    "unstable",
    "webview-data-url",
] }
tauri-plugin-deep-link = "2.0.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
tauri-plugin-opener = "2"
# Prevents a second launch from racing into CEF init and hitting the
# `cef::initialize(...) != 1` cache-lock panic seen in production
# (Sentry AURA-TAURI-A). The plugin acquires a per-identifier
# lock before any tauri::Builder work happens, so the secondary
# process exits cleanly after handing its argv to the primary.
tauri-plugin-single-instance = "2"
# Auto-update for the Tauri shell itself. The core sidecar already has its own
# updater (see `core_update.rs`); this plugin handles the .app/.exe/.AppImage
# bundle. Both are needed because shipping a new RPC method requires both
# pieces in lockstep, and on macOS the .app bundle is what carries TCC grants.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
# Used by gmail/cdp_fetch for decoding binary IO.read chunks. Base64 is
# only emitted by CDP IO.read when the stream contains non-UTF-8 bytes,
# but we opt into the feature to stay robust against unexpected responses.
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
# WebSocket client + server for two uses:
# - Client: Chrome DevTools Protocol connections to the embedded CEF
#   instance over `--remote-debugging-port=9222` (IndexedDB reads,
#   `Runtime.evaluate` for the WhatsApp recipe, DOMSnapshot / Network
#   calls for the Gmail connector).
# - Server: the `webview_apis` bridge at 127.0.0.1 that accepts
#   JSON-RPC frames from the core sidecar so core-side handlers can
#   reach the live-webview connectors via CDP.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9"
hex = "0.4"
# Tauri's vendored dev-server proxy (see `vendor/tauri-cef/.../protocol/tauri.rs`)
# builds a reqwest 0.13 client that requires a process-wide rustls
# `CryptoProvider`. Without one, `ClientBuilder::build()` panics with
# "No provider set" the first time `tauri dev` proxies a request. We install
# the ring provider at startup in `lib.rs::run()`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
log = "0.4"
env_logger = "0.11"

# Sentry for the Tauri shell (desktop host) process — separate Sentry project
# from the React frontend and the Rust core sidecar. DSN is baked at compile
# time via `option_env!("AURA_TAURI_SENTRY_DSN")` in `lib.rs::run()` and
# can be overridden at runtime via the same env var. Feature set mirrors the
# core sidecar (`Cargo.toml` at repo root) minus `tracing` since the shell
# uses `log` + `env_logger`.
sentry = { version = "0.47.0", default-features = false, features = ["backtrace", "contexts", "panic", "debug-images", "reqwest", "rustls"] }

# Used by the imessage_scanner module.
anyhow = "1.0"
parking_lot = "0.12"
chrono = "0.4"
async-trait = "0.1"
# Mascot fake-camera pipeline (meet_call): rasterizes the Aura
# mascot SVG to a PNG once, converts it to a YUV420 Y4M frame, and
# points CEF's `--use-file-for-fake-video-capture` flag at the cached
# file so Meet sees the mascot as the agent's webcam. Pure Rust, no
# system codecs needed.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
tiny-skia = "0.11"
# CEF + tauri-runtime-cef dependencies (always required).
# `tauri-runtime-cef::notification::register` is how we hook native Web
# Notification interception per webview, and `cef::Browser` is what we downcast
# from the boxed handle returned by `Webview::with_webview`. tauri-runtime-cef
# isn't published to crates.io — we vendor the whole tauri fork as a submodule
# at `vendor/tauri-cef` and reference the crate by path.
tauri-runtime-cef = { path = "vendor/tauri-cef/crates/tauri-runtime-cef" }
cef = { version = "=146.4.1", default-features = false }

# Core domain logic, embedded in-process so the core's HTTP/JSON-RPC server
# runs as a tokio task inside the Tauri host. Avoids the orphan-sidecar class
# of bugs (PR #1061: Cmd+Q leaving `aura-core` and CEF helpers behind)
# by tying the core's lifetime to the GUI process. The existing port-7788
# probe in `core_process::ensure_running` still attaches to a running
# `aura-core run` harness when one is already listening.
aura_core = { path = "../..", package = "aura", default-features = false }

# meeting_recorder: local audio capture + mixing + VAD + transcription
# pipeline (Meetily-inspired, Phase 2+3 of the meetings integration).
# Windows-only capability for now — non-Windows builds compile these deps
# too (they're pure-Rust / prebuilt-binary, no heavy C++ toolchain) but
# `meeting_recorder::devices` stubs out with an explicit "not yet
# implemented" error rather than pretending to support it.
cpal = "0.15.3"
# Silero VAD. `default-features = false` drops the crate's own
# `audio_resampler` feature (which would pull in `rubato 0.16`, a second
# incompatible copy of the resampler we already depend on directly at
# 0.15). We resample to 16kHz ourselves upstream of the VAD (see
# `meeting_recorder::resample`) and always feed it pre-resampled audio.
# `static-model` embeds the ONNX VAD model directly in the binary (~1.7MB)
# so there's no separate VAD model download/path to manage.
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero", default-features = false, features = [
    "static-model",
] }
# `silero` depends on `ort` (onnxruntime bindings) for VAD inference. ort's
# default download-strategy prebuilt libs are dynamically-linked (/MD) on
# Windows, which conflicts (LNK2038/LNK1169) with the vendored
# `whisper-rs-sys` fork's forced static CRT (/MT, patched to match CEF's
# release DLLs — see the whisper-rs-sys patch comment below). Pinning a
# direct `ort` dependency at the version silero already resolves to, with
# `load-dynamic`, unifies Cargo's feature resolution so silero's `ort` build
# ALSO loads onnxruntime.dll at runtime (dlopen-equivalent) instead of
# statically linking an import lib — sidesteps the CRT conflict entirely.
# Needs `ORT_DYLIB_PATH` set to a real onnxruntime.dll to actually run VAD;
# the build succeeds either way since load-dynamic defers loading to first use.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
rubato = "0.15.0"
ringbuf = "0.4.8"
# meeting_recorder::screenshot: periodic primary-monitor capture for slide
# OCR. Pure-Rust, cross-platform (Windows/macOS/Linux), no native C
# toolchain requirement — capture itself is not gated behind the
# Windows-only guard the rest of meeting_recorder has (whisper
# transcription is Windows-only for now; screenshot capture works
# everywhere `xcap::Monitor::all()` is supported).
xcap = "0.9"
# PNG encode/decode + downscaling for the screenshot dedup check above.
# Already resolved transitively via `xcap`'s own `image` dependency (see
# Cargo.lock) at the same 0.25 line as the root crate's `image` dep — declared
# directly here because `screenshot.rs` uses `image::` paths itself, and Cargo
# does not expose a transitive dependency's paths to a crate that doesn't
# declare it directly.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3.2"
mac-notification-sys = "0.6"
# iMessage scanner reads ~/Library/Messages/chat.db read-only on macOS.
rusqlite = { version = "0.37", features = ["bundled"] }
objc2-user-notifications = "0.3.2"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSTimer", "block2"] }
# Native WKWebView host for the floating mascot window — bypasses CEF
# (which can't render transparent windowed-mode browsers).
objc2-web-kit = { version = "0.3.2", features = ["block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["dbus"] }

[target.'cfg(target_os = "windows")'.dependencies]
# AttachConsole — re-attach to the parent shell when the binary runs as a CLI
# (the `core` subcommand). The main binary itself is windows-subsystem so
# launching the Tauri app from Explorer does not pop a console; the helper
# CEF subprocess re-execs inherit that same subsystem.
windows-sys = { version = "0.59", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    # EnumWindows / ShowWindow / SW_HIDE / SW_SHOW used by the main-window
    # close handler. tauri-runtime-cef's window.hide() / minimize() target a
    # cef::Window internal handle, not the visible Chrome_WidgetWin_1
    # top-level frame, so we walk the OS window list ourselves (#1607).
    "Win32_UI_WindowsAndMessaging",
    # CreateMutexW / CloseHandle — used by the pre-CEF single-instance guard
    # (see run() in lib.rs) that detects a second launch before CefRuntime::init
    # fires (Sentry AURA-TAURI-A).
    # Win32_Security is required because CreateMutexW's SECURITY_ATTRIBUTES
    # parameter is gated behind it in windows-sys 0.59.
    "Win32_System_Threading",
    "Win32_Security",
] }
# meeting_recorder transcription engine (CPU-only, no vulkan/cuda/metal —
# see the module doc comment for scope). Deliberately pinned to the SAME
# version already resolved transitively via `aura_core` (root
# Cargo.toml depends on `whisper-rs = "0.16"`) rather than the newer
# `0.13.2`/`raw-api` combination used upstream by Meetily: app/src-tauri
# and the root crate are separate crate graphs with separate Cargo.locks
# (see CLAUDE.md), but pinning the same version here means Cargo unifies
# on one resolved `whisper-rs`/`whisper-rs-sys`, so whisper.cpp is only
# ever compiled once for this crate graph instead of twice — important
# given how heavy that C++/cmake build is on disk and build time. The
# `whisper-rs-sys` patch below already fixes the MSVC CRT mismatch for
# both call sites.
whisper-rs = "0.16"

[features]
default = []
# `custom-protocol` switches Tauri from `devUrl` (vite dev server) to the
# bundled `frontendDist` served via `tauri://localhost`. `cargo tauri build`
# turns this on automatically for release; do not put it in `default` or
# every `pnpm dev:app` will silently load the production bundle. DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
sandbox-bubblewrap = []
# Forwarded to the core crate to expose `aura.test_reset`. Off by
# default; the E2E build flips it on via `cargo tauri build --features
# e2e-test-support`. See app/scripts/e2e-build.sh.
e2e-test-support = ["aura_core/e2e-test-support"]

[patch.crates-io]
# `cargo tauri build` resolves dependencies from this manifest, so the
# workspace-level whisper-rs-sys patch is not applied here. The fork forces
# whisper.cpp to use MSVC's static runtime (/MT), matching CEF and avoiding
# LNK2038/LNK1169 CRT conflicts on Windows.
whisper-rs-sys = { git = "https://github.com/tinyhumansai/whisper-rs-sys.git", branch = "main" }

# WASAPI loopback capture (meeting_recorder: opening an INPUT stream on an
# OUTPUT device to record system audio) is not supported by stock cpal —
# this fork adds it. Because `[patch.crates-io]` applies to the whole crate
# graph resolved from THIS manifest, this also affects the `cpal = "0.15"`
# dependency pulled in transitively via `aura_core` (used there only
# for plain microphone capture in `aura::voice::audio_capture`) — the
# fork is API-compatible with upstream 0.15.x for normal (non-loopback)
# input capture, so this should be a no-op for that call site, but flag it
# if mic dictation ever regresses after this patch lands.
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }

# CEF support lives on the `feat/cef` branch of tauri-apps/tauri. We carry our
# own fork at tinyhumansai/tauri-cef on `feat/cef-notification-intercept` which
# adds native Web Notifications interception — `tauri-runtime-cef::notification`
# (browser-process callback registry) plus `cef-helper` patching `window.Notification`
# and `ServiceWorkerRegistration.prototype.showNotification` from the renderer
# side. The fork is vendored as a git submodule at `vendor/tauri-cef`; the
# submodule's recorded commit is the pin.
#
# Plugins still patch from upstream tauri-apps/plugins-workspace@feat/cef — the
# fork is tauri-only.
tauri = { path = "vendor/tauri-cef/crates/tauri" }
tauri-build = { path = "vendor/tauri-cef/crates/tauri-build" }
tauri-utils = { path = "vendor/tauri-cef/crates/tauri-utils" }
tauri-macros = { path = "vendor/tauri-cef/crates/tauri-macros" }
tauri-runtime = { path = "vendor/tauri-cef/crates/tauri-runtime" }
tauri-runtime-wry = { path = "vendor/tauri-cef/crates/tauri-runtime-wry" }
tauri-plugin = { path = "vendor/tauri-cef/crates/tauri-plugin" }

# Pinned to a specific commit on plugins-workspace@feat/cef so fresh
# dependency resolution (without Cargo.lock) is reproducible and doesn't
# silently drift when upstream pushes to the branch.
tauri-plugin-opener = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "c6561ab6b4f9e7f650d4fc8c53fd8acc9b65b9b2" }
tauri-plugin-deep-link = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "c6561ab6b4f9e7f650d4fc8c53fd8acc9b65b9b2" }
tauri-plugin-global-shortcut = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "c6561ab6b4f9e7f650d4fc8c53fd8acc9b65b9b2" }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "c6561ab6b4f9e7f650d4fc8c53fd8acc9b65b9b2" }
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]` for the
# idle-watchdog unit tests in `cdp/session.rs` (#1213).
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
tempfile = "3"

# Emit just enough DWARF in release builds for Sentry to symbolicate Rust
# panics + render surrounding source lines. `line-tables-only` keeps the
# binary small (only file+line tables, no full type info) while still
# letting `sentry-cli debug-files upload --include-sources` produce a
# usable `.src.zip`. `split-debuginfo = "packed"` writes the debug data
# into a separate `.dSYM` bundle on macOS so the shipped executable
# itself stays slim.
[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"

# Fast CI builds: trade runtime perf for compile speed
[profile.ci]
inherits = "release"
opt-level = 1
codegen-units = 16
lto = false
incremental = false
strip = true
debug = false
