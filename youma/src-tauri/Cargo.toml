[package]
name = "youma"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
once_cell = "1.17"
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
sha2 = "0.10"
open = "5"
pdf-extract = "0.7"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
walkdir = "2"
rayon = "1"
hnsw_rs = "0.3"
ort = { version = "2.0.0-rc.10", features = ["ndarray", "download-binaries"], optional = true }
ndarray = { version = "0.16", optional = true }
pyannote-rs = { git = "https://github.com/gregoire22enpc/pyannote-rs", rev = "ae9fbc1", optional = true }
symphonia = { version = "0.5", features = ["mp3", "aac", "ogg", "wav", "isomp4"], optional = true }

[features]
diarize = ["ort", "ndarray", "pyannote-rs", "symphonia"]

[target.'cfg(not(target_os = "linux"))'.dependencies]
tts = "0.26"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
