[advisories]
# Known false positives — transitive deps outside direct project control.
# Each entry is documented with the crate, advisory, and reason.
#
# GTK3 bindings (RUSTSEC-2024-0411 through 0420) — pulled in transitively by
# tauri's Linux GTK backend. These crates are unmaintained because gtk-rs has
# moved to GTK4; Tauri's own GTK3 dependency will be resolved when Tauri ships
# GTK4 support. No action possible from this project.
#
# glib unsoundness (RUSTSEC-2024-0429) — VariantStrIter unsoundness in glib
# 0.18.x, same transitive chain as GTK3 above. Not reachable from project code.
#
# bincode unmaintained (RUSTSEC-2025-0141) — pulled in by hnsw_rs (vector
# search library). bincode 1.x is still widely used and stable; the advisory
# is a maintenance warning, not a CVE. No patched version of hnsw_rs available.
#
# proc-macro-error unmaintained (RUSTSEC-2024-0370) — build-time proc-macro
# dep pulled by yew-macro and glib-macros. No active exploit; purely advisory.
#
# unic-* unmaintained (RUSTSEC-2025-0075/0080/0081/0098/0100) — pulled in
# transitively. No CVE associated; purely maintenance warnings.
ignore = [
  # GTK3 bindings — Tauri Linux transitive deps, no project-side fix available
  "RUSTSEC-2024-0411",  # gdkwayland-sys unmaintained
  "RUSTSEC-2024-0412",  # gdk unmaintained
  "RUSTSEC-2024-0413",  # atk unmaintained
  "RUSTSEC-2024-0414",  # gdkx11-sys unmaintained
  "RUSTSEC-2024-0415",  # gtk unmaintained
  "RUSTSEC-2024-0416",  # atk-sys unmaintained
  "RUSTSEC-2024-0417",  # gdkx11 unmaintained
  "RUSTSEC-2024-0418",  # gdk-sys unmaintained
  "RUSTSEC-2024-0419",  # gtk3-macros unmaintained
  "RUSTSEC-2024-0420",  # gtk-sys unmaintained
  "RUSTSEC-2024-0429",  # glib VariantStrIter unsoundness — Tauri transitive, not reachable
  # bincode — pulled by hnsw_rs, no updated hnsw_rs release available
  "RUSTSEC-2025-0141",  # bincode unmaintained
  # proc-macro-error — build-time dep via glib-macros / yew-macro
  "RUSTSEC-2024-0370",  # proc-macro-error unmaintained
  # unic-* — transitive, no CVE, purely maintenance warnings
  "RUSTSEC-2025-0075",  # unic-char-range unmaintained
  "RUSTSEC-2025-0080",  # unic-common unmaintained
  "RUSTSEC-2025-0081",  # unic-char-property unmaintained
  "RUSTSEC-2025-0098",  # unic-ucd-version unmaintained
  "RUSTSEC-2025-0100",  # unic-ucd-ident unmaintained
]

[output]
deny = ["unmaintained", "unsound", "yanked"]
